<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="theme-color" content="#0d2034">
  <meta name="description" content="按竞彩销售日期查看胜平负、让球胜平负、进球数及半全场纵向走势图，分享所选日期与玩法。">

<body>
<div id="jczq-trend-v2" aria-labelledby="jczq-trend-v2-title">
  <style>
    #jczq-trend-v2 {
      --jc-ink: var(--foreground);
      --jc-muted: var(--muted-foreground);
      --jc-line: color-mix(in srgb, var(--border) 70%, transparent);
      --jc-soft-line: color-mix(in srgb, var(--border) 35%, transparent);
      --jc-blue: var(--viz-series-1);
      --jc-orange: var(--viz-series-2);
      width: 100%;
      max-width: 680px;
      margin-inline: auto;
      color: var(--jc-ink);
      font-size: var(--font-size-base, 14px);
      box-sizing: border-box;
      overflow: hidden;
    }
    #jczq-trend-v2 *, #jczq-trend-v2 *::before, #jczq-trend-v2 *::after { box-sizing: border-box; }
    #jczq-trend-v2 .masthead {
      padding: 2px 0 20px;
      border-bottom: 1px solid var(--jc-line);
    }
    #jczq-trend-v2 .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: var(--jc-muted);
      font-size: 11px;
      letter-spacing: .06em;
    }
    #jczq-trend-v2 .eyebrow::before {

      background: var(--jc-blue);

    #jczq-trend-v2 .dek {
      max-width: 520px;
      margin-top: 8px;
      color: var(--jc-muted);
      font-size: 12px;
      line-height: 1.55;
    }
    #jczq-trend-v2 .headline-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }
    #jczq-trend-v2 .headline-total {
      flex: 0 0 auto;
      text-align: right;
    }
    #jczq-trend-v2 .headline-total strong {
      display: block;
      font-size: 31px;
      line-height: .95;
      font-weight: 500;
    }
    #jczq-trend-v2 .headline-total span {
      color: var(--jc-muted);
      font-size: 11px;
    }
    #jczq-trend-v2 .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 16px;
      margin-top: 15px;
      color: var(--jc-muted);
      font-size: 11px;
    }
    #jczq-trend-v2 .summary strong { color: var(--jc-ink); font-weight: 500; }
    #jczq-trend-v2 .summary .blue { color: var(--jc-blue); }
    #jczq-trend-v2 .summary .orange { color: var(--jc-orange); }
    #jczq-trend-v2 .section {
      padding-top: 22px;
    }
    #jczq-trend-v2 .section-heading {

      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }
    #jczq-trend-v2 .section-heading h2 {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 500;
    }
    #jczq-trend-v2 .section-heading p {
      color: var(--jc-muted);
      font-size: 11px;
      text-align: right;
    }
    #jczq-trend-v2 .trend-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 14px;
      margin: 0 0 10px;
      color: var(--jc-muted);
      font-size: 11px;
    }
    #jczq-trend-v2 .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      white-space: nowrap;
    }
    #jczq-trend-v2 .legend-stroke { width: 22px; border-top: 2px solid currentColor; }
    #jczq-trend-v2 .legend-stroke.blue { color: var(--jc-blue); }
    #jczq-trend-v2 .legend-stroke.orange { color: var(--jc-orange); border-top-style: dashed; }
    #jczq-trend-v2 .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    #jczq-trend-v2 .legend-dot.win { color: var(--green); }
    #jczq-trend-v2 .legend-dot.draw { color: var(--yellow); }
    #jczq-trend-v2 .legend-dot.loss { color: var(--red); }
    #jczq-trend-v2 .chart-shell {
      width: 100%;
      min-width: 0;
      padding: 10px 0 4px;
      border-top: 1px solid var(--jc-soft-line);
      border-bottom: 1px solid var(--jc-soft-line);
    }
    #jczq-trend-v2 .chart-wrap { width: 100%; min-width: 0; }
    #jczq-trend-v2 .trend-chart {
      display: block;
      width: 100%;
      height: 780px;
      overflow: visible;
    }
    #jczq-trend-v2 .chart-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 3px;
      color: var(--jc-muted);
      font-size: 10px;
    }
    #jczq-trend-v2 .chart-foot strong { color: var(--jc-ink); font-weight: 500; }
    #jczq-trend-v2 .report-section { padding-top: 27px; }
    #jczq-trend-v2 .report-heading { margin-bottom: 5px; }

    #jczq-trend-v2 .match-list { border-top: 1px solid var(--jc-line); }
    #jczq-trend-v2 .match-item {
      position: relative;
      padding: 16px 0 17px 28px;
      border-bottom: 1px solid var(--jc-soft-line);
      scroll-margin-top: 12px;
    }
    #jczq-trend-v2 .match-item::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 8px;
      width: 1px;
      background: var(--jc-soft-line);
      content: "";
    }
    #jczq-trend-v2 .match-item::after {
      position: absolute;
      top: 19px;
      left: 4px;
      width: 9px;
      height: 9px;
      border: 2px solid var(--background);
      border-radius: 50%;
      background: var(--jc-muted);
      box-shadow: 0 0 0 1px var(--jc-line);
      content: "";
    }
    #jczq-trend-v2 .match-item.is-highlighted { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    #jczq-trend-v2 .match-item.is-highlighted::after { background: var(--jc-blue); }
    #jczq-trend-v2 .match-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      min-width: 0;
      color: var(--jc-muted);
      font-size: 11px;
    }
    #jczq-trend-v2 .match-meta .code { color: var(--jc-ink); font-weight: 500; }
    #jczq-trend-v2 .league-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    #jczq-trend-v2 .league-tag::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--jc-blue);
      content: "";
    }
    #jczq-trend-v2 .fixture {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-width: 0;
      margin-top: 12px;
    }
    #jczq-trend-v2 .team-side {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    #jczq-trend-v2 .team-side.away { flex-direction: row-reverse; text-align: right; }
    #jczq-trend-v2 .team-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.25;
    }
    #jczq-trend-v2 .team-logo {
      display: block;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      object-fit: contain;
    }
    #jczq-trend-v2 .team-logo.is-fallback {
      display: grid;
      place-items: center;
      border: 1px solid var(--jc-line);
      border-radius: 50%;
      color: var(--jc-muted);
      font-size: 10px;
    }
    #jczq-trend-v2 .score {
      text-align: center;
    }
    #jczq-trend-v2 .score strong {
      display: block;
      font-size: 24px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: .03em;
    }
    #jczq-trend-v2 .score span {
      display: block;
      margin-top: 6px;
      color: var(--jc-muted);
      font-size: 10px;
      white-space: nowrap;
    }
    #jczq-trend-v2 .facts {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--jc-soft-line);
    }
    #jczq-trend-v2 .fact { min-width: 0; }
    #jczq-trend-v2 .fact-label {
      display: block;
      color: var(--jc-muted);
      font-size: 10px;
      line-height: 1.2;
      white-space: nowrap;
    }
    #jczq-trend-v2 .fact-value {
      display: block;
      margin-top: 5px;
      color: var(--jc-ink);
      font-size: 13px;
      line-height: 1.2;
      font-weight: 500;
      overflow-wrap: anywhere;
    }
    #jczq-trend-v2 .fact-value.blue { color: var(--jc-blue); }
    #jczq-trend-v2 .fact-value.orange { color: var(--jc-orange); }
    #jczq-trend-v2 .fact-value.win { color: var(--green); }
    #jczq-trend-v2 .fact-value.draw { color: var(--yellow); }
    #jczq-trend-v2 .fact-value.loss { color: var(--red); }
    #jczq-trend-v2 .match-note {
      margin-top: 10px;
      color: var(--jc-muted);
      font-size: 10px;
      line-height: 1.45;
    }
    @media (max-width: 430px) {
      #jczq-trend-v2 h1 { font-size: 22px; }
      #jczq-trend-v2 .fixture { grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1fr); gap: 6px; }
      #jczq-trend-v2 .team-logo { width: 26px; height: 26px; flex-basis: 26px; }
      #jczq-trend-v2 .team-side { gap: 6px; }
      #jczq-trend-v2 .team-name { font-size: 14px; }
      #jczq-trend-v2 .score strong { font-size: 22px; }
      #jczq-trend-v2 .match-item { padding-left: 24px; }
    }
    @media (max-width: 350px) {
      #jczq-trend-v2 .fixture { grid-template-columns: minmax(0, 1fr) 54px minmax(0, 1fr); gap: 4px; }
      #jczq-trend-v2 .team-name { font-size: 13px; }
      #jczq-trend-v2 .fact-label { font-size: 9px; }
      #jczq-trend-v2 .fact-value { font-size: 12px; }
    }

    #jczq-trend-v2 h1 { font-size: 23px; }
    #jczq-trend-v2 .dek { display: none; }
    #jczq-trend-v2 .headline-row { align-items: center; }
    #jczq-trend-v2 .headline-total strong { font-size: 28px; }
    #jczq-trend-v2 .summary { gap: 4px 12px; margin-top: 9px; font-size: 11px; }
    #jczq-trend-v2 .section { padding-top: 12px; }
    #jczq-trend-v2 .trend-section {
      --chart-muted: #a9bbca;

    #jczq-trend-v2 .match-list { display: grid; gap: 7px; border: 0; }
    #jczq-trend-v2 .match-item {

    :root {
      color-scheme: light;
      --h5-bg: #f2f6f9;
      --h5-card: #ffffff;
      --h5-ink: #10243a;
      --h5-muted: #718292;
      --h5-line: #dce6ed;
    }
    html { background: var(--h5-bg); }
    body {
      min-width: 320px;
      margin: 0;
      background: var(--h5-bg);
      color: var(--h5-ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #jczq-trend-v2 {
      --foreground: #10243a;
      --muted-foreground: #718292;
      --border: #dce6ed;
      --background: #f2f6f9;
      --card: #ffffff;
      --accent: #dcebf2;
      --green: #21a36a;
      --yellow: #d78b18;
      --red: #dd5a59;
      --viz-series-1: #36b9d5;
      --viz-series-2: #ef9b3f;
      max-width: 760px;
      padding: max(18px, env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    }
    #jczq-trend-v2 .masthead {
      margin: 0 -14px;
      position: relative;
      padding: 27px 21px 24px;
      overflow: hidden;
      background: radial-gradient(circle at 92% 0%, rgb(61 177 205 / 18%), transparent 34%), linear-gradient(145deg, #0b1d30 0%, #102d47 65%, #0e2439 100%);
      border: 0;
      border-radius: 0 0 22px 22px;
      color: #f7fbfd;
      box-shadow: inset 0 -1px 0 rgb(142 208 226 / 18%);
    }
    #jczq-trend-v2 .masthead::before { position: absolute; z-index: 0; left: 0; top: 26px; width: 3px; height: 88px; border-radius: 0 3px 3px 0; background: #55d4ee; box-shadow: 0 0 22px rgb(85 212 238 / 50%); content: ""; pointer-events: none; }
    #jczq-trend-v2 .masthead::after { position: absolute; z-index: 0; right: -42px; bottom: -74px; width: 180px; height: 180px; border: 1px solid rgb(119 212 229 / 16%); border-radius: 50%; box-shadow: 0 0 0 18px rgb(119 212 229 / 4%), 0 0 0 36px rgb(119 212 229 / 3%); content: ""; pointer-events: none; }
    #jczq-trend-v2 .masthead > * { position: relative; z-index: 1; }
